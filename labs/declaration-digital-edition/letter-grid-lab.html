<!DOCTYPE html>
<html lang="en" data-history-page="declaration" data-history-open="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KBatch · Letter-Grid Lab · research · play · benchmark</title>
  <meta
    name="description"
    content="Full Letter-Grid lab: casual timed play + contrails, research (pattern flow, word deep-sort, deep xref, open-reader), and multi-run agent benchmark ledger."
  />
  <meta name="theme-color" content="#0c0b0a" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/labs.css" />
  <link rel="stylesheet" href="/css/declaration-edition.css" />
  <link rel="stylesheet" href="/css/declaration-letter-grid.css?v=classy7" />
  <link rel="stylesheet" href="/css/letter-grid-lab.css?v=lab1" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("kbatch-dict-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t || "dark");
        document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body class="labs-page dec-page lgl-page">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand">
          <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <span class="theme-icon theme-icon--sun" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon--moon" aria-hidden="true">☾</span>
          </button>
          <h1><span>KBatch</span> Letter-Grid Lab</h1>
          <span class="brand-sub">Research · casual play · benchmark</span>
        </div>
        <nav class="site-nav" aria-label="Site"></nav>
      </div>
      <div class="meta-row">
        <span class="status-line"
          >Full codex play · contrails · pattern flow · word sort · deep xref · multi-run agent ledger</span
        >
      </div>
    </div>
  </header>

  <nav class="dec-version-nav" data-dec-nav data-active="letter-grid-lab" aria-label="Declaration edition toolbox"></nav>

  <main class="labs-main" style="max-width: min(1180px, 100%)">
    <div id="lgl-root"></div>
  </main>

  <footer class="app-footer">
    Letter-Grid Lab · research + casual + benchmark ·
    <a href="letter-grid.html">Play only</a> ·
    <a href="open-reader.html">Open reader</a> ·
    <a href="/">Dictionary ↗</a>
  </footer>

  <!-- open-reader optional for deep search in Research tab -->
  <script src="/js/open-reader-search.js?v=ors1"></script>
  <script src="/js/declaration-letter-grid.js?v=classy7"></script>
  <script src="/js/letter-grid-lab.js?v=lab1"></script>
  <script>
    document.getElementById("theme-toggle")?.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = cur === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      try {
        localStorage.setItem("kbatch-dict-theme", next);
      } catch {
        /* */
      }
    });
    window.__kbatchLetterGridLab
      .mount(document.getElementById("lgl-root"), {
        dataBase: "/data/declaration",
        N: 12,
        hopMs: 120,
        roundS: 70,
      })
      .catch(function (e) {
        var m = document.getElementById("lgl-root");
        if (m)
          m.innerHTML =
            '<p class="arc-err">Lab failed: ' +
            String(e && e.message ? e.message : e) +
            "</p>";
      });
  </script>
  <script src="/js/declaration-edition-nav.js" defer></script>
  <script src="/js/site-nav.js" defer></script>
</body>
</html>
