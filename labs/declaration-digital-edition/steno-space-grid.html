<!DOCTYPE html>
<html lang="en" data-history-page="declaration" data-history-open="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KBatch · Steno-Space Letter-Grid · GrokYtalkY glyph · Rubik QR</title>
  <meta
    name="description"
    content="Letter-grid of every stenoSTRIP whitespace slot from the Declaration. GrokYtalkY bust glyph chat, video qbit codec frames, Rubik origin-tree QR for solving and number generation."
  />
  <meta name="theme-color" content="#0c0b0a" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/labs.css" />
  <link rel="stylesheet" href="/css/declaration-edition.css" />
  <link rel="stylesheet" href="/css/steno-space-letter-grid.css?v=ssg1" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("kbatch-dict-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t || "dark");
        document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body class="labs-page dec-page ssg-page">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand">
          <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <span class="theme-icon theme-icon--sun" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon--moon" aria-hidden="true">☾</span>
          </button>
          <h1><span>KBatch</span> Steno-Space Grid</h1>
          <span class="brand-sub">Blank coins · GrokYtalkY glyph · Rubik QR · video qbit</span>
        </div>
        <nav class="site-nav" aria-label="Site"></nav>
      </div>
      <div class="meta-row">
        <span class="status-line"
          >All stenoSTRIP spaces from the document · 13-space alphabet · bust glyph chat · origin-tree numbers</span
        >
      </div>
    </div>
  </header>

  <nav class="dec-version-nav" data-dec-nav data-active="steno-space-grid" aria-label="Declaration edition toolbox"></nav>

  <main class="labs-main" style="max-width: min(1100px, 100%)">
    <div id="ssg-mount"></div>
  </main>

  <footer class="app-footer">
    Steno-space letter-grid · educational stego capacity · GrokYtalkY glyph rail ·
    <a href="/">Dictionary ↗</a>
  </footer>

  <script src="/js/steno-space-letter-grid.js?v=ssg1"></script>
  <script>
    document.getElementById("theme-toggle")?.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = cur === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      try {
        localStorage.setItem("kbatch-dict-theme", next);
      } catch {
        /* */
      }
    });
    window.__kbatchStenoSpaceLetterGrid
      .mount(document.getElementById("ssg-mount"), {
        dataBase: "/data/declaration",
        N: 13,
      })
      .catch(function (e) {
        var m = document.getElementById("ssg-mount");
        if (m)
          m.innerHTML =
            '<p class="arc-err">Steno-space grid failed: ' +
            String(e && e.message ? e.message : e) +
            "</p>";
      });
  </script>
  <script src="/js/declaration-edition-nav.js" defer></script>
  <script src="/js/site-nav.js" defer></script>
</body>
</html>
