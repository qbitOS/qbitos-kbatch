<!DOCTYPE html>
<html lang="en" data-history-page="declaration" data-history-open="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KBatch · Declaration Letter-Grid · WebGrid litmus</title>
  <meta
    name="description"
    content="WebGrid-style square-chunk letter game over the Declaration of Independence · cross-ref lines · growth stair gateway to archival documents · Memory Glass tensor loop."
  />
  <meta name="theme-color" content="#0c0b0a" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/labs.css" />
  <link rel="stylesheet" href="/css/declaration-edition.css" />
  <link rel="stylesheet" href="/css/declaration-letter-grid.css?v=dark2" />
  <script>
    (function () {
      try {
        /* Litmus boards default dark — light theme was washing out claim/select text */
        var t = localStorage.getItem("kbatch-dict-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        /* keep explicit user light, but page CSS now has real light contrast too */
        document.documentElement.setAttribute("data-theme", t || "dark");
        document.documentElement.style.colorScheme = (t === "light") ? "light" : "dark";
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
      }
    })();
  </script>
</head>
<body class="labs-page dec-page dlg-page dlg-dark-prefer">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand">
          <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <span class="theme-icon theme-icon--sun" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon--moon" aria-hidden="true">☾</span>
          </button>
          <h1><span>KBatch</span> Letter-Grid</h1>
          <span class="brand-sub">Declaration · WebGrid grammar · document gateway</span>
        </div>
        <nav class="site-nav" aria-label="Site"></nav>
      </div>
      <div class="meta-row">
        <span class="status-line"
          >Square chunks · letter cross-ref · growth stair → archive · MG / persona-tensor litmus</span
        >
      </div>
    </div>
  </header>

  <nav class="dec-version-nav" data-dec-nav data-active="letter-grid" aria-label="Declaration edition toolbox"></nav>

<main class="labs-main" style="max-width: min(1100px, 100%)">
    <div id="dlg-mount"></div>
  </main>

  <footer class="app-footer">
    Letter-Grid litmus · NARA public-domain transcript ·
    <a href="https://www.archives.gov/founding-docs/declaration-transcript" target="_blank" rel="noopener">NARA</a> ·
    BPS grammar mirrors WebGrid · gateway to edition documents ·
    <a href="/">Dictionary ↗</a>
  </footer>

  <script src="/js/declaration-letter-grid.js"></script>
  <script>
    document.getElementById("theme-toggle")?.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = cur === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      try {
        localStorage.setItem("kbatch-dict-theme", next);
      } catch {
        /* */
      }
    });
    window.__kbatchDeclarationLetterGrid
      .mount(document.getElementById("dlg-mount"), {
        dataBase: "/data/declaration",
        N: 12,
      })
      .catch(function (e) {
        var m = document.getElementById("dlg-mount");
        if (m) m.innerHTML = '<p class="arc-err">Letter-Grid failed: ' + String(e && e.message ? e.message : e) + "</p>";
      });
  </script>
    <script src="/js/declaration-edition-nav.js" defer></script>
  <script src="/js/site-nav.js" defer></script>
</body>
</html>
