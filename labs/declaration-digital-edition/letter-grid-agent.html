<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Letter-Grid agent play</title>
  <link rel="stylesheet" href="/css/declaration-letter-grid.css?v=score4" />
  <style>
    body { margin: 0; background: #0c0b0a; color: #e6edf3; font: 14px ui-sans-serif, system-ui; }
    #result { margin: 12px; padding: 12px; border-radius: 10px; background: #141820; white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <div id="dlg-mount"></div>
  <pre id="result">agent starting…</pre>
  <script src="/js/declaration-letter-grid.js?v=score4"></script>
  <script>
    (async function () {
      var result = document.getElementById("result");
      try {
        var q = new URLSearchParams(location.search);
        /* MG human-pace default hop ~120ms (sudoku-style score report) */
        var pace = parseInt(q.get("hop") || q.get("pace") || "120", 10);
        var roundS = parseInt(q.get("round") || "70", 10);
        var N = parseInt(q.get("N") || "12", 10);
        var api = await window.__kbatchDeclarationLetterGrid.mount(
          document.getElementById("dlg-mount"),
          { dataBase: "/data/declaration", N: N, roundS: roundS, hopMs: pace, autoplay: false }
        );
        result.textContent = "playing " + roundS + "s · " + N + "×" + N + " · hop ~" + pace + "ms…";
        var rep = await api.agentPlay({ paceMs: pace });
        result.textContent = (rep.markdown || "") + "\n\n---\n\n" + JSON.stringify(rep, null, 2);
        document.title =
          "DONE " +
          Number(rep.peakBps).toFixed(2) +
          " BPS / " +
          rep.peakNtpm +
          " NTPM · hit " +
          (rep.metrics && rep.metrics.hitRateLabel);
        document.documentElement.dataset.agentDone = "1";
        document.documentElement.dataset.peakBps = String(rep.peakBps);
        document.documentElement.dataset.peakNtpm = String(rep.peakNtpm);
        document.documentElement.dataset.hits = String(rep.hits);
        document.documentElement.dataset.live = rep.live || "";
        document.documentElement.dataset.reportTitle = rep.title || "";
        console.log("LETTER_GRID_RESULT", JSON.stringify(rep));
        console.log("LETTER_GRID_MD", rep.markdown);
      } catch (e) {
        result.textContent = String(e && e.stack ? e.stack : e);
        document.documentElement.dataset.agentDone = "err";
      }
    })();
  </script>
</body>
</html>
